name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (build · test · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps (for redocly + openapi-typescript)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: API contract is in sync
        run: make generate-check

      - name: Test
        run: go test ./...

      - name: Architecture (inward dependency rule)
        run: |
          go install github.com/roblaszczak/go-cleanarch@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lint-arch

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Storybook stories run as browser tests under `pnpm test` via the
      # Vitest browser project; Chromium must be present.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: i18n types drift check
        run: pnpm i18n:types && git diff --exit-code src/i18n/resources.d.ts src/i18n/i18next.d.ts

      # Hard gate: the embedded verification email artifacts must match the
      # react-email templates they are rendered from.
      - name: Email templates drift check
        run: pnpm emails:build && git diff --exit-code ../internal/auth/adapters/emails

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Hard gate: every feature area is migrated to t(); a new hardcoded
      # UI string (or an en/ru key-parity gap) fails the build.
      - name: i18n key lint
        run: pnpm i18n:lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # API Gateway caps a response at 2.5 MB, so on the serverless install a
      # bigger static asset would not load.
      - name: Static assets fit API Gateway
        run: |
          big=$(find .output/public -type f -size +2400k)
          if [ -n "$big" ]; then echo "over the API Gateway response cap (2.5 MB): $big"; exit 1; fi

      # Smoke gate: a broken story or Storybook config fails the build even if
      # the story tests happened to pass.
      - name: Build Storybook
        run: pnpm build-storybook

  terraform:
    name: Terraform (fmt · validate · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform/nvelope-serverless
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # Plan-only tests with mock providers: no cloud credentials needed.
      - name: Test
        run: terraform test
