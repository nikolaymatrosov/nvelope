Problem:
  type: object
  description: >
    An RFC 9457 problem detail. Some problems carry context-specific
    extension members beyond the fields listed here (for example a stale-row
    409 conflict's currentUpdatedAt); the server's custom marshaling flattens
    those onto this same top-level object rather than nesting them, so
    additional keys are always possible and should not fail validation.
  required: [type, title, status, code]
  additionalProperties: true
  properties:
    type:
      type: string
      format: uri
      description: A URI identifying the problem type; always the code appended to https://nvelope.dev/probs/.
    title:
      type: string
      description: A short, human-readable summary of the problem type.
    status:
      type: integer
      description: The HTTP status code.
    detail:
      type: string
      description: A human-readable explanation specific to this occurrence.
    instance:
      type: string
      description: The request path this problem occurred on.
    code:
      type: string
      description: The stable machine-readable error slug. Branch on this, not on the message.
    requestId:
      type: string
      description: The X-Request-Id correlating this failure across the BFF and Go tiers.
    errors:
      type: array
      description: Field-level violations, present on validation failures.
      items:
        $ref: '#/FieldError'

FieldError:
  type: object
  description: One request-body violation.
  required: [field, code]
  properties:
    field:
      type: string
      description: A JSON Pointer into the submitted request body.
    code:
      type: string
    detail:
      type: string
