openapi: 3.0.3
info:
  title: nvelope tenant API
  version: 1.0.0
  description: |
    The workspace-scoped API. Every operation requires an authenticated user,
    a resolved tenant, and a permission check. Errors are RFC 9457 problem
    documents.
servers:
  - url: /t/{slug}/api
    description: Workspace-scoped base path.
    variables:
      slug:
        default: workspace
        description: The workspace slug from the URL.
security:
  - WorkspaceSession: []
paths: {}
components:
  securitySchemes:
    WorkspaceSession:
      type: apiKey
      in: cookie
      name: nv_workspace
      description: |
        The tenant-plane workspace session cookie (distinct from the control-plane session cookie). Every operation in this document requires it.
