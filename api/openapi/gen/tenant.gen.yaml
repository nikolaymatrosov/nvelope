openapi: 3.0.3
info:
  title: nvelope tenant API
  version: 1.0.0
  description: |
    The workspace-scoped API. Every operation requires an authenticated user,
    a resolved tenant, and a permission check. Errors are RFC 9457 problem
    documents.
servers:
  - url: /t/{slug}/api
    description: Workspace-scoped base path.
    variables:
      slug:
        default: workspace
        description: The workspace slug from the URL.
security:
  - WorkspaceSession: []
paths:
  /lists:
    get:
      operationId: listLists
      summary: List the workspace's subscriber lists.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: A page of lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createList
      summary: Create a subscriber list.
      tags:
        - audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
      responses:
        '201':
          description: The list was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /lists/{id}:
    get:
      operationId: getList
      summary: Fetch one subscriber list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateList
      summary: Update a subscriber list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListRequest'
      responses:
        '204':
          description: The list was updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteList
      summary: Delete a subscriber list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: The list was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    WorkspaceSession:
      type: apiKey
      in: cookie
      name: nv_workspace
      description: |
        The tenant-plane workspace session cookie (distinct from the control-plane session cookie). Every operation in this document requires it.
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum rows to return. Zero or absent means the server default.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Rows to skip.
      schema:
        type: integer
        minimum: 0
    IdParam:
      name: id
      in: path
      required: true
      description: The resource's UUID.
      schema:
        type: string
  schemas:
    ListVisibility:
      type: string
      description: Whether a list is publicly discoverable or private.
      enum:
        - private
        - public
    ListOptIn:
      type: string
      description: The subscription confirmation mode for a list.
      enum:
        - single
        - double
    List:
      type: object
      description: A subscriber list.
      required:
        - id
        - name
        - description
        - visibility
        - optIn
        - tags
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/ListVisibility'
        optIn:
          $ref: '#/components/schemas/ListOptIn'
        tags:
          type: array
          description: Free-form labels attached to the list.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListPage:
      type: object
      description: A page of subscriber lists with the total matching count.
      required:
        - items
        - total
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/List'
        total:
          type: integer
    FieldError:
      type: object
      description: One request-body violation.
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: A JSON Pointer into the submitted request body.
        code:
          type: string
        detail:
          type: string
    Problem:
      type: object
      description: |
        An RFC 9457 problem detail. Some problems carry context-specific extension members beyond the fields listed here (for example a stale-row 409 conflict's currentUpdatedAt); the server's custom marshaling flattens those onto this same top-level object rather than nesting them, so additional keys are always possible and should not fail validation.
      required:
        - type
        - title
        - status
        - code
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type; always the code appended to https://nvelope.dev/probs/.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: The request path this problem occurred on.
        code:
          type: string
          description: The stable machine-readable error slug. Branch on this, not on the message.
        requestId:
          type: string
          description: The X-Request-Id correlating this failure across the BFF and Go tiers.
        errors:
          type: array
          description: Field-level violations, present on validation failures.
          items:
            $ref: '#/components/schemas/FieldError'
    CreateListRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          default: ''
        visibility:
          allOf:
            - $ref: '#/components/schemas/ListVisibility'
          default: private
        optIn:
          allOf:
            - $ref: '#/components/schemas/ListOptIn'
          default: single
        tags:
          type: array
          description: Free-form labels attached to the list.
          items:
            type: string
    CreatedId:
      type: object
      description: The identifier of a newly created resource.
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
    UpdateListRequest:
      allOf:
        - $ref: '#/components/schemas/CreateListRequest'
  responses:
    Unauthorized:
      description: No authenticated workspace session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller lacks the required permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: An unexpected server failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request was malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the resource's current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The request body failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource in this workspace.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
