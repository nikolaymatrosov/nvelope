openapi: 3.0.3
info:
  title: nvelope tenant API
  version: 1.0.0
  description: |
    The workspace-scoped API. Every operation requires an authenticated user,
    a resolved tenant, and a permission check. Errors are RFC 9457 problem
    documents.
servers:
  - url: /t/{slug}/api
    description: Workspace-scoped base path.
    variables:
      slug:
        default: workspace
        description: The workspace slug from the URL.
security:
  - WorkspaceSession: []
paths:
  /lists:
    get:
      operationId: listLists
      summary: List the workspace's subscriber lists.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: A page of lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createList
      summary: Create a subscriber list.
      tags:
        - audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListRequest'
      responses:
        '201':
          description: The list was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /lists/{id}:
    get:
      operationId: getList
      summary: Fetch one subscriber list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateList
      summary: Update a subscriber list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateListRequest'
      responses:
        '204':
          description: The list was updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteList
      summary: Delete a subscriber list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: The list was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscribers:
    get:
      operationId: searchSubscribers
      summary: Search subscribers by free text.
      tags:
        - audience
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text search over email and name.
          schema:
            type: string
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: A page of subscribers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createSubscriber
      summary: Create a subscriber.
      tags:
        - audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriberRequest'
      responses:
        '201':
          description: The subscriber was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscribers/query:
    post:
      operationId: querySubscribers
      summary: Evaluate a segment and return matching subscribers.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentQueryRequest'
      responses:
        '200':
          description: A page of matching subscribers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscribers/query/count:
    post:
      operationId: countSubscribers
      summary: Evaluate a segment and return only the match count.
      tags:
        - audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentQueryRequest'
      responses:
        '200':
          description: The number of matching subscribers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentCountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscribers/{id}:
    get:
      operationId: getSubscriber
      summary: Fetch one subscriber.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The subscriber.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateSubscriber
      summary: Update a subscriber.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriberRequest'
      responses:
        '204':
          description: The subscriber was updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteSubscriber
      summary: Delete a subscriber.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: The subscriber was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscribers/{id}/lists:
    post:
      operationId: addSubscriberToList
      summary: Add a subscriber to a list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToListRequest'
      responses:
        '204':
          description: The subscriber was added.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /subscribers/{id}/lists/{listId}:
    delete:
      operationId: removeSubscriberFromList
      summary: Remove a subscriber from a list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/ListIdParam'
      responses:
        '204':
          description: The subscriber was removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: changeSubscription
      summary: Change a subscriber's status on a list.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/ListIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSubscriptionRequest'
      responses:
        '204':
          description: The subscription status was changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /import:
    post:
      operationId: startImport
      summary: Start a subscriber import from an uploaded CSV or ZIP.
      tags:
        - audience
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A CSV or ZIP file, at most 32 MiB.
                listIds:
                  type: array
                  description: Lists to add every imported subscriber to.
                  items:
                    type: string
      responses:
        '202':
          description: The import job was enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /export:
    post:
      operationId: startExport
      summary: Start a subscriber export.
      tags:
        - audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExportRequest'
      responses:
        '202':
          description: The export job was enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /jobs/{id}:
    get:
      operationId: getJobStatus
      summary: Fetch an import or export job's progress.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The job's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /jobs/{id}/download:
    get:
      operationId: downloadExport
      summary: Download a completed export's CSV.
      tags:
        - audience
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The generated CSV.
          headers:
            Content-Disposition:
              description: attachment; filename="..."
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    WorkspaceSession:
      type: apiKey
      in: cookie
      name: nv_workspace
      description: |
        The tenant-plane workspace session cookie (distinct from the control-plane session cookie). Every operation in this document requires it.
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum rows to return. Zero or absent means the server default.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Rows to skip.
      schema:
        type: integer
        minimum: 0
    IdParam:
      name: id
      in: path
      required: true
      description: The resource's UUID.
      schema:
        type: string
    ListIdParam:
      name: listId
      in: path
      required: true
      description: The list's UUID.
      schema:
        type: string
  schemas:
    ListVisibility:
      type: string
      description: Whether a list is publicly discoverable or private.
      enum:
        - private
        - public
    ListOptIn:
      type: string
      description: The subscription confirmation mode for a list.
      enum:
        - single
        - double
    List:
      type: object
      description: A subscriber list.
      required:
        - id
        - name
        - description
        - visibility
        - optIn
        - tags
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/ListVisibility'
        optIn:
          $ref: '#/components/schemas/ListOptIn'
        tags:
          type: array
          description: Free-form labels attached to the list.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListPage:
      type: object
      description: A page of subscriber lists with the total matching count.
      required:
        - items
        - total
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/List'
        total:
          type: integer
    FieldError:
      type: object
      description: One request-body violation.
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: A JSON Pointer into the submitted request body.
        code:
          type: string
        detail:
          type: string
    Problem:
      type: object
      description: |
        An RFC 9457 problem detail. Some problems carry context-specific extension members beyond the fields listed here (for example a stale-row 409 conflict's currentUpdatedAt); the server's custom marshaling flattens those onto this same top-level object rather than nesting them, so additional keys are always possible and should not fail validation.
      required:
        - type
        - title
        - status
        - code
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type; always the code appended to https://nvelope.dev/probs/.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: The request path this problem occurred on.
        code:
          type: string
          description: The stable machine-readable error slug. Branch on this, not on the message.
        requestId:
          type: string
          description: The X-Request-Id correlating this failure across the BFF and Go tiers.
        errors:
          type: array
          description: Field-level violations, present on validation failures.
          items:
            $ref: '#/components/schemas/FieldError'
    CreateListRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          default: ''
        visibility:
          allOf:
            - $ref: '#/components/schemas/ListVisibility'
          default: private
        optIn:
          allOf:
            - $ref: '#/components/schemas/ListOptIn'
          default: single
        tags:
          type: array
          description: Free-form labels attached to the list.
          items:
            type: string
    CreatedId:
      type: object
      description: The identifier of a newly created resource.
      required:
        - id
      additionalProperties: false
      properties:
        id:
          type: string
    UpdateListRequest:
      allOf:
        - $ref: '#/components/schemas/CreateListRequest'
    SubscriberState:
      type: string
      description: A subscriber's lifecycle state.
      enum:
        - enabled
        - disabled
        - blocklisted
    SubscriptionStatus:
      type: string
      description: |
        A subscription's lifecycle status: unconfirmed (awaiting confirmation), confirmed, or unsubscribed.
      enum:
        - unconfirmed
        - confirmed
        - unsubscribed
    Membership:
      type: object
      description: A subscriber's confirmation status within one list.
      required:
        - listId
        - status
      additionalProperties: false
      properties:
        listId:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
    Subscriber:
      type: object
      required:
        - id
        - email
        - name
        - state
        - attributes
        - memberships
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        state:
          $ref: '#/components/schemas/SubscriberState'
        attributes:
          type: object
          description: Custom subscriber attributes, keyed by field slug.
          additionalProperties: true
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubscriberPage:
      type: object
      description: A page of subscribers with the total matching count.
      required:
        - items
        - total
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscriber'
        total:
          type: integer
    CreateSubscriberRequest:
      type: object
      required:
        - email
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          default: ''
        attributes:
          type: object
          description: Custom subscriber attributes, keyed by field slug.
          additionalProperties: true
        listIds:
          type: array
          items:
            type: string
    SegmentNode:
      type: object
      description: |
        One node of a segment condition tree: either a group of children joined by a conjunction, or exactly one leaf condition.
      additionalProperties: false
      properties:
        conj:
          type: string
          enum:
            - and
            - or
        children:
          type: array
          items:
            $ref: '#/components/schemas/SegmentNode'
        field:
          $ref: '#/components/schemas/FieldCondition'
        attr:
          $ref: '#/components/schemas/AttrCondition'
        member:
          $ref: '#/components/schemas/MemberCondition'
    SegmentOp:
      type: string
      description: A segment comparison operator.
      enum:
        - eq
        - neq
        - exists
        - contains
        - gt
        - lt
        - gte
        - lte
    FieldCondition:
      type: object
      description: Matches a known subscriber field.
      required:
        - field
        - op
      additionalProperties: false
      properties:
        field:
          type: string
        op:
          $ref: '#/components/schemas/SegmentOp'
        value:
          type: string
          description: The comparison value. Not required for the exists operator.
    AttrCondition:
      type: object
      description: Matches a custom-attribute key.
      required:
        - key
        - op
      additionalProperties: false
      properties:
        key:
          type: string
        op:
          $ref: '#/components/schemas/SegmentOp'
        value:
          description: The comparison value; type depends on the attribute.
    MemberCondition:
      type: object
      description: Matches by membership of a list, optionally with a status.
      required:
        - listId
      additionalProperties: false
      properties:
        listId:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
    SegmentQueryRequest:
      type: object
      required:
        - segment
      additionalProperties: false
      properties:
        segment:
          $ref: '#/components/schemas/SegmentNode'
    SegmentCountResponse:
      type: object
      required:
        - total
      additionalProperties: false
      properties:
        total:
          type: integer
    UpdateSubscriberRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        attributes:
          type: object
          description: Custom subscriber attributes, keyed by field slug.
          additionalProperties: true
        state:
          allOf:
            - $ref: '#/components/schemas/SubscriberState'
          default: enabled
    AddToListRequest:
      type: object
      required:
        - listId
      additionalProperties: false
      properties:
        listId:
          type: string
    ChangeSubscriptionRequest:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
    JobAccepted:
      type: object
      required:
        - jobId
      additionalProperties: false
      properties:
        jobId:
          type: string
    StartExportRequest:
      type: object
      required:
        - selection
      additionalProperties: false
      properties:
        selection:
          type: string
          description: Which subscribers to export.
          enum:
            - all
            - list
            - segment
        listId:
          type: string
        segment:
          $ref: '#/components/schemas/SegmentNode'
    RowFailure:
      type: object
      required:
        - row
        - reason
      additionalProperties: false
      properties:
        row:
          type: integer
        reason:
          type: string
    JobStatus:
      type: object
      required:
        - id
        - kind
        - status
        - fileName
        - createdCount
        - updatedCount
        - failedCount
        - rowCount
        - failures
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          description: Whether this is an import or an export job.
          enum:
            - import
            - export
        status:
          type: string
          description: The job's lifecycle status.
          enum:
            - pending
            - running
            - completed
            - failed
        fileName:
          type: string
        createdCount:
          type: integer
          description: Rows that created a new subscriber.
        updatedCount:
          type: integer
